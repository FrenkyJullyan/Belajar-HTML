<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Tutorial Link di HTML</title>
    </head>
    <body>
        <!-- contoh link internal -->
        <p>Untuk lebih lengkapnya, silakan buka:
            <a href="about.html">About us</a>
        </p>
        <!-- contoh link eksternal
            menggunakan atribut _blank -->
        <p>Follow akun github saya
            <a href="https://github.com/FrenkyJullyan" target="_blank" title="menuju web github">FrenkyJullyan</a>
        </p>
        <!-- membuat link untuk memanggil JavaScript -->
        <p>
            <a href="#" onclick="alert('Hello World!')">Jalankan JS</a> 
            <br />
            <a href="#!" onmouseover="alert('link sudah kamu sentuh!')">Coba Sentuh Link ini</a>
        </p>
        <P>
            <a href="#"><img src="c:\Users\frenk\Downloads\wallpaperflare.com_wallpaper.jpg"></a>
        </P>
    </body>
</html>
